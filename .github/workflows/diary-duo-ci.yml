name: Diary and Duo validation
on:
  push:
    branches: [feat/journal-garden-duo]
  pull_request:
    paths:
      - "App.tsx"
      - "src/**"
      - "tests/**"
      - "package*.json"
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run export:preview

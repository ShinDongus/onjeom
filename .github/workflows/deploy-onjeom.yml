name: Publish verified Onjeom diary preview
on:
  push:
    branches: [feat/expo-onjeom]
    paths:
      - .github/workflows/deploy-onjeom.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: onjeom-pages-release
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test preserved data and flower rules
        run: npm test
      - name: Verify TypeScript
        run: npm run check
      - name: Export GitHub Pages preview
        run: npm run export:pages
      - name: Publish static app to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run publish:pages
      - name: Summarize deployment
        run: |
          echo "Published from ${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Site: https://shindongus.github.io/onjeom/" >> "${GITHUB_STEP_SUMMARY}"

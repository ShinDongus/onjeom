name: Verify small-action product flow
on:
  pull_request:
    branches: [feat/expo-onjeom]
  push:
    branches: [feat/restore-small-action-flow]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:actions
      - uses: actions/upload-artifact@v4
        with:
          name: onjeom-small-action-preview
          path: |
            dist-preview/
            artifacts/action-*.png

name: Verify Groq organizer without real API keys
on:
  push:
    branches: [feat/groq-ai-organizer]
  pull_request:
    paths:
      - "App.tsx"
      - "src/groq-client.mjs"
      - "backend/**"
      - "tests/groq-*.test.mjs"
      - ".github/workflows/groq-checks.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run export:preview

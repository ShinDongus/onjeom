name: Verify Onjeom Groq backend public URLs
on:
  push:
    branches: [feat/expo-onjeom]
    paths:
      - .github/workflows/verify-groq-backend-live.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check deployed landing, health, and method guard
        run: |
          node --input-type=module <<'NODE'
          const base="https://onjeom-groq-api.vercel.app";
          for(const [path, expected] of [["/",200],["/api/health",200],["/api/organize",405]]){
            let response;
            for(let i=0;i<12;i++){
              try{response=await fetch(base+path,{redirect:"follow",headers:{Accept:"application/json, text/html"},signal:AbortSignal.timeout(10000)});}
              catch(e){console.log(path,"network failure",e.message);}
              if(response?.status===expected)break;
              console.log(path,"HTTP",response?.status,"expected",expected,"try",i+1);
              if(i<11)await new Promise(r=>setTimeout(r,5000));
            }
            if(response?.status!==expected)throw Error(path+" HTTP "+response?.status+" expected "+expected);
            const body=await response.text();
            if(path==="/" && !body.includes("온점. AI 연결 서버")) throw Error("Landing content missing");
            if(path==="/api/health"){
              const j=JSON.parse(body);
              if(j.service!=="onjeom-groq-api"||!["configuration_required","configured"].includes(j.status))throw Error("Health response invalid");
              console.log("health:",j.status);
            }
            console.log("verified",path,expected);
          }
          NODE

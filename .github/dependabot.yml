{
  "version": 2,
  "updates": [
    {
      "package-ecosystem": "npm",
      "directory": "/",
      "target-branch": "feat/expo-onjeom",
      "schedule": {
        "interval": "daily",
        "time": "06:00",
        "timezone": "Asia/Seoul"
      },
      "open-pull-requests-limit": 5,
      "groups": {
        "react-runtime": {
          "patterns": [
            "react",
            "react-dom",
            "react-server-dom-*",
            "next",
            "eslint-config-next"
